name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Kiểm tra cú pháp server
        run: |
          cd server
          npm ci --no-audit --no-fund
          for f in $(find src -name '*.js'); do node --check "$f"; done
          echo "✅ Server syntax OK"

      - name: Build giao diện
        run: |
          cd client
          npm ci --no-audit --no-fund
          npm run build
          echo "✅ Client build OK"

      - name: Khởi động thử server & gọi health
        run: |
          cd server
          node src/index.js &
          sleep 3
          curl -sf http://127.0.0.1:3000/api/health
          echo "✅ Health OK"
