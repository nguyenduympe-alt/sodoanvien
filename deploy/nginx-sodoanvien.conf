# Nginx reverse proxy cho Sổ Đoàn viên số — tối ưu VPS 1GB RAM
# Deploy.sh tự copy file này vào /etc/nginx/sites-available/sodoanvien
# Nếu dùng tên miền: sửa server_name _;  thành  server_name so.doanvien.example.edu;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Xác minh Let's Encrypt (certbot --webroot) — để bật HTTPS
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }

    # Giới hạn dung lượng upload (form hồ sơ, không dùng file lớn)
    client_max_body_size 8m;

    # Nén gzip — giảm ~70% dung lượng JS/CSS, rất có lợi cho đường truyền yếu
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # File tĩnh có hash trong tên → cache dài
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API + SPA
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
