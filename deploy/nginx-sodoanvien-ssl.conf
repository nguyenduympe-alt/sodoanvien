# Nginx cho Sổ Đoàn viên số — HTTPS (Let's Encrypt) · tối ưu VPS nhỏ
# Dùng SAU KHI đã có chứng chỉ:
#   certbot certonly --webroot -w /var/www/certbot -d sodoanvien.io.vn -d www.sodoanvien.io.vn
#   cp deploy/nginx-sodoanvien-ssl.conf /etc/nginx/sites-available/sodoanvien && nginx -t && systemctl reload nginx
# Gia hạn tự động: certbot.timer (webroot /var/www/certbot) + hook reload nginx.

# ---- HTTP: chỉ phục vụ xác minh Let's Encrypt, còn lại chuyển HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name sodoanvien.io.vn www.sodoanvien.io.vn;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://sodoanvien.io.vn$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;          # nginx 1.24 (Ubuntu 24.04); nginx ≥1.25 có thể đổi sang 'http2 on;'
    listen [::]:443 ssl http2;
    server_name sodoanvien.io.vn www.sodoanvien.io.vn;

    ssl_certificate     /etc/letsencrypt/live/sodoanvien.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sodoanvien.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_sodoanvien:5m;
    ssl_session_timeout 1d;

    # www → tên miền chính
    if ($host = www.sodoanvien.io.vn) { return 301 https://sodoanvien.io.vn$request_uri; }

    # Bảo mật cơ bản (HSTS 6 tháng — không includeSubDomains để không ảnh hưởng tên miền phụ khác)
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload ảnh VNeID/CCCD cho AI đọc ảnh (base64 ~ 1,4x kích thước ảnh)
    client_max_body_size 12m;

    # Nén gzip — giảm ~70% dung lượng JS/CSS
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # File tĩnh có hash trong tên → cache dài
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # API + SPA
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # lần đọc ảnh đầu tiên cần nạp mô hình AI (~5–10 giây)
    }
}
